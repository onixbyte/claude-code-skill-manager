[package]
name = "claude-code-skill-manager"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "ccsm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
zip = "2"
flate2 = "1"
tar = "0.4"
